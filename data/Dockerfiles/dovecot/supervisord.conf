[supervisord]
nodaemon=true
user=root
pidfile=/var/run/supervisord.pid

[program:syslog-ng]
command=/usr/sbin/syslog-ng --foreground --no-caps
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true

[program:dovecot]
command=/usr/sbin/dovecot -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:estelaz-push-worker]
command=/bin/sh -c 'if [ -n "$ESTELAZ_PUSH_URL" ] && [ -n "$ESTELAZ_PUSH_TOKEN" ]; then inotifywait -m -r -e close_write,moved_to --format "%%w%%f" /var/vmail | /usr/local/bin/push-worker.py; else exec sleep infinity; fi'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
stopasgroup=true
killasgroup=true

[eventlistener:processes]
command=/usr/local/sbin/stop-supervisor.sh
events=PROCESS_STATE_STOPPED, PROCESS_STATE_EXITED, PROCESS_STATE_FATAL
