# Dovecot for helper-scripts/dev_tests/pgp-storage/plugin, with the plugins
# mailcow loads ahead of mail_pgp_storage (see the dovecot docker-entrypoint.sh).
protocols = imap lmtp
listen = 127.0.0.1
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain
log_path = /var/log/dovecot.log
mail_location = maildir:/var/vmail/%u
mail_plugins = quota acl zlib mail_crypt mail_crypt_acl mail_pgp_storage
first_valid_uid = 1
passdb {
  driver = passwd-file
  args = scheme=PLAIN /etc/dovecot/users
}
userdb {
  driver = passwd-file
  args = /etc/dovecot/users
}
service lmtp {
  inet_listener lmtp {
    address = 127.0.0.1
    port = 24
  }
}
protocol imap {
  mail_plugins = $mail_plugins imap_quota imap_acl imap_zlib
}
plugin {
  quota = maildir:User quota
  acl = vfile
  zlib_save = lz4
  mail_crypt_global_private_key = </etc/dovecot/ecprivkey.pem
  mail_crypt_global_public_key = </etc/dovecot/ecpubkey.pem
  mail_crypt_save_version = 2
  pgp_storage_filter_bin = /usr/local/bin/fake-encrypt
  pgp_storage_timeout = 30
}
